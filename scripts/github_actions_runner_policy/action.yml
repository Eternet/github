name: Eternet self-hosted runner policy
description: Reject GitHub-hosted runner selectors and unverified dynamic/reusable workflows.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Audit all workflow runner selectors
      shell: bash
      env:
        POLICY_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        policy_venv="$(mktemp -d "$RUNNER_TEMP/runner-policy.XXXXXXXX")"
        trap 'rm -rf -- "$policy_venv"' EXIT
        python -m venv "$policy_venv"
        "$policy_venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3
        "$policy_venv/bin/python" "$POLICY_ACTION_PATH/check.py" --root "$GITHUB_WORKSPACE" --git-ref HEAD
